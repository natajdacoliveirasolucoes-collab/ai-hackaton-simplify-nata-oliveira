<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini-CRM Lite</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mini-CRM Lite</h1>
    <p>Logado como <strong id="usuario-logado"></strong> · dados de clientes salvos neste navegador (localStorage)</p>
  </header>

  <nav class="tabs">
    <a href="#dashboard" data-target="tab-dashboard">Dashboard</a>
    <a href="#clientes" data-target="tab-clientes">Clientes</a>
    <a href="#catalogo" data-target="tab-catalogo">Catálogo</a>
    <span class="spacer"></span>
    <span class="sair" id="btn-sair">Sair</span>
  </nav>

  <!-- DASHBOARD -->
  <section id="tab-dashboard">
    <div class="stat-grid" id="stat-grid"></div>

    <div class="card" style="padding:1.2rem;">
      <h2 style="font-size:.95rem; margin:0 0 1rem;">Clientes por status</h2>
      <div id="barras-status"></div>
    </div>

    <div class="card" style="padding:1.2rem; margin-top:1rem;">
      <h2 style="font-size:.95rem; margin:0 0 1rem;">Produtos por categoria</h2>
      <div id="barras-categoria" class="carregando">Carregando produtos da Fake Store API...</div>
    </div>
  </section>

  <!-- CLIENTES -->
  <section id="tab-clientes" hidden>
    <div class="bar">
      <form id="form-add-cliente" class="linha">
        <input id="input-nome" placeholder="Nome do cliente" required />
        <select id="input-plano">
          <option>Básico</option>
          <option>Pro</option>
          <option>Enterprise</option>
        </select>
        <button type="submit">Adicionar cliente</button>
      </form>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr><th>Nome</th><th>Plano</th><th>Status</th><th>Alterar</th><th></th></tr>
        </thead>
        <tbody id="tbody-clientes"></tbody>
      </table>
    </div>

    <div class="log">
      <h2>Log de ações</h2>
      <div id="log"></div>
    </div>
  </section>

  <!-- CATÁLOGO -->
  <section id="tab-catalogo" hidden>
    <div class="bar">
      <select id="filtro-categoria">
        <option value="">Todas as categorias</option>
      </select>
    </div>
    <div id="catalogo-grid" class="catalogo-grid">
      <div class="carregando">Carregando produtos...</div>
    </div>
  </section>
</div>

<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
